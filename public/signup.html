<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>СтудТест — Регистрация</title>
    <style>
        :root {
            --qf-bright-blue: #338ff9;
            --qf-turquoise: #20aeb9;
            --qf-bg: #eaf4fc;
            --qf-dark-blue: #127ab6;
            --qf-white: #ffffff;
            --qf-shadow: 0 8px 24px rgba(18, 122, 182, 0.08);
            --qf-radius-lg: 18px;
            --qf-radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Gothic A1", sans-serif;
            background: var(--qf-bg);
            color: #1a202c;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            background: var(--qf-white);
            box-shadow: 0 2px 12px rgba(18, 122, 182, 0.06);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .logo-group img { height: 36px; width: auto; object-fit: contain; }
        .logo-group span {
            font-size: 17px;
            font-weight: 1000;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #1a202c;
            transform: translateY(1.5px);
        }

        .header-right { display: flex; align-items: center; gap: 12px; }

        .login-btn {
            background: var(--qf-bright-blue);
            color: var(--qf-white);
            border: none;
            padding: 9px 22px;
            border-radius: var(--qf-radius-md);
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            transition: filter 0.2s, transform 0.15s;
        }
        .login-btn:hover { filter: brightness(1.06); }
        .login-btn:active { transform: scale(0.97); }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .form-container {
            max-width: 440px;
            width: 100%;
            background: var(--qf-white);
            padding: 34px 30px 28px;
            border-radius: var(--qf-radius-lg);
            box-shadow: var(--qf-shadow);
        }

        .form-title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            color: var(--qf-dark-blue);
            margin-bottom: 22px;
            letter-spacing: 0.02em;
        }

        .info-box {
            background: linear-gradient(135deg, rgba(51, 143, 249, 0.07), rgba(32, 174, 185, 0.07));
            border: 1px solid rgba(51, 143, 249, 0.18);
            border-radius: var(--qf-radius-md);
            padding: 14px 16px;
            margin-bottom: 20px;
        }
        .info-box h4 {
            color: var(--qf-dark-blue);
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 700;
        }
        .info-box p {
            color: #3b6b8a;
            font-size: 12px;
            line-height: 1.5;
            font-weight: 500;
        }

        .form-section { margin-bottom: 20px; }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input, select {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid rgba(51, 143, 249, 0.2);
            border-radius: var(--qf-radius-md);
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            color: #1a202c;
            background: var(--qf-white);
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: auto;
        }
        input::placeholder, select option[value=""] { color: #94a3b8; }
        input:focus, select:focus {
            outline: none;
            border-color: var(--qf-bright-blue);
            box-shadow: 0 0 0 3px rgba(51, 143, 249, 0.15);
        }
        select:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .group-section {
            border-top: 2px solid rgba(51, 143, 249, 0.1);
            padding-top: 20px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--qf-dark-blue);
            margin-bottom: 14px;
        }

        .group-success {
            background: #e6fbf0;
            color: #0f7b4b;
            padding: 12px 16px;
            border-radius: var(--qf-radius-md);
            margin-top: 12px;
            border: 1px solid #a7f3d0;
            font-size: 14px;
            font-weight: 600;
        }

        .submit-btn {
            width: 100%;
            background: var(--qf-bright-blue);
            color: var(--qf-white);
            border: none;
            padding: 14px;
            border-radius: var(--qf-radius-md);
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            margin-top: 20px;
            transition: filter 0.2s, transform 0.15s;
        }
        .submit-btn:hover { filter: brightness(1.06); }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled {
            background: #b0c4d8;
            cursor: not-allowed;
            filter: none;
        }

        .toggle-auth { text-align: center; margin-top: 18px; }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--qf-turquoise);
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        .toggle-btn:hover { color: var(--qf-dark-blue); text-decoration: underline; }

        .toggle-btn--accent {
            color: var(--qf-bright-blue);
        }
        .toggle-btn--accent:hover { color: var(--qf-dark-blue); }

        .message {
            padding: 14px 16px;
            border-radius: var(--qf-radius-md);
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
        .message.success {
            background: #e6fbf0;
            color: #0f7b4b;
            border: 1px solid #a7f3d0;
        }
        .message.error {
            background: #fff1f1;
            color: #c53030;
            border: 1px solid #fecaca;
        }
        .message.info {
            background: linear-gradient(135deg, rgba(51, 143, 249, 0.08), rgba(32, 174, 185, 0.08));
            color: var(--qf-dark-blue);
            border: 1px solid rgba(51, 143, 249, 0.2);
        }

        .error-text {
            color: #dc2626;
            font-size: 12px;
            margin-top: 4px;
            font-weight: 500;
        }

        .loading { display: flex; align-items: center; justify-content: center; gap: 8px; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-group">
            <img src="/icons/Logo.png" alt="">
            <span>СтудТест</span>
        </div>
        <div class="header-right">
            <button class="login-btn" id="loginBtn">Войти</button>
        </div>
    </header>

    <main class="main">
        <div class="form-container">
            <h2 class="form-title">Регистрация</h2>

            <div class="info-box">
                <h4>📧 Подтверждение email</h4>
                <p>После регистрации вам будет отправлено письмо с ссылкой для подтверждения email. Вы сможете войти в систему только после подтверждения.</p>
            </div>

            <div id="messageContainer"></div>

            <form id="authForm">
                <div class="form-section">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="Введите ваш email">
                        <div class="error-text" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password" required placeholder="Введите ваш пароль" minlength="6">
                        <div class="error-text" id="passwordError"></div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-group">
                        <label for="lastName">Фамилия:</label>
                        <input type="text" id="lastName" name="lastName" required placeholder="Введите вашу фамилию">
                        <div class="error-text" id="lastNameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="firstName">Имя:</label>
                        <input type="text" id="firstName" name="firstName" required placeholder="Введите ваше имя">
                        <div class="error-text" id="firstNameError"></div>
                    </div>
                </div>

                <div class="group-section">
                    <h3 class="section-title">Выбор учебной группы</h3>

                    <div id="groupSelector">
                        <div class="form-group">
                            <label for="building">Корпус</label>
                            <select id="building" name="building" required>
                                <option value="">Выберите корпус</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="course">Курс</label>
                            <select id="course" name="course" required disabled>
                                <option value="">Сначала выберите корпус</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="group">Группа</label>
                            <select id="group" name="group" required disabled>
                                <option value="">Сначала выберите курс</option>
                            </select>
                        </div>
                    </div>

                    <div class="error-text" id="groupError"></div>

                    <div id="groupSuccess" class="group-success" style="display: none;">
                        Группа успешно выбрана
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Зарегистрироваться</button>
            </form>

            <div class="toggle-auth">
                <button class="toggle-btn" id="toggleAuthBtn">Уже есть аккаунт? Войти</button>
            </div>

            <div class="toggle-auth">
                <button class="toggle-btn toggle-btn--accent" id="toggleToTeacherBtn">Регистрация для преподавателей</button>
            </div>
        </div>
    </main>

    <script src="/signup.js"></script>
</body>
</html>
