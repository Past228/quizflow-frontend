<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>СтудТест — Вход</title>
    <style>
        :root {
            --qf-bright-blue: #338ff9;
            --qf-turquoise: #20aeb9;
            --qf-bg: #eaf4fc;
            --qf-dark-blue: #127ab6;
            --qf-white: #ffffff;
            --qf-shadow: 0 8px 24px rgba(18, 122, 182, 0.08);
            --qf-radius-lg: 18px;
            --qf-radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Gothic A1", sans-serif;
            background: var(--qf-bg);
            color: #1a202c;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            background: var(--qf-white);
            box-shadow: 0 2px 12px rgba(18, 122, 182, 0.06);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-group img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }

        .logo-group span {
            font-size: 17px;
            font-weight: 1000;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #1a202c;
            transform: translateY(1.5px);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .signup-btn {
            background: var(--qf-bright-blue);
            color: var(--qf-white);
            border: none;
            padding: 9px 22px;
            border-radius: var(--qf-radius-md);
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            transition: filter 0.2s, transform 0.15s;
        }
        .signup-btn:hover { filter: brightness(1.06); }
        .signup-btn:active { transform: scale(0.97); }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .form-container {
            max-width: 420px;
            width: 100%;
            background: var(--qf-white);
            padding: 36px 32px 32px;
            border-radius: var(--qf-radius-lg);
            box-shadow: var(--qf-shadow);
        }

        .form-title {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            color: var(--qf-dark-blue);
            margin-bottom: 28px;
            letter-spacing: 0.02em;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid rgba(51, 143, 249, 0.2);
            border-radius: var(--qf-radius-md);
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            color: #1a202c;
            background: var(--qf-white);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: #94a3b8; }
        input:focus {
            outline: none;
            border-color: var(--qf-bright-blue);
            box-shadow: 0 0 0 3px rgba(51, 143, 249, 0.15);
        }

        .submit-btn {
            width: 100%;
            background: var(--qf-bright-blue);
            color: var(--qf-white);
            border: none;
            padding: 14px;
            border-radius: var(--qf-radius-md);
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            margin-top: 20px;
            transition: filter 0.2s, transform 0.15s;
        }
        .submit-btn:hover { filter: brightness(1.06); }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled {
            background: #b0c4d8;
            cursor: not-allowed;
            filter: none;
        }

        .toggle-auth {
            text-align: center;
            margin-top: 22px;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--qf-turquoise);
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        .toggle-btn:hover { color: var(--qf-dark-blue); text-decoration: underline; }

        .reset-intro {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 18px;
            line-height: 1.5;
            text-align: center;
        }

        .auth-panel-hidden { display: none !important; }

        .message {
            padding: 14px 16px;
            border-radius: var(--qf-radius-md);
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
        .message.success {
            background: #e6fbf0;
            color: #0f7b4b;
            border: 1px solid #a7f3d0;
        }
        .message.error {
            background: #fff1f1;
            color: #c53030;
            border: 1px solid #fecaca;
        }

        .error-text {
            color: #dc2626;
            font-size: 12px;
            margin-top: 4px;
            font-weight: 500;
        }

        .loading { display: flex; align-items: center; justify-content: center; gap: 8px; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-group">
            <img src="/icons/Logo.png" alt="">
            <span>СтудТест</span>
        </div>
        <div class="header-right">
            <button class="signup-btn" id="signupBtn">Регистрация</button>
        </div>
    </header>

    <main class="main">
        <div class="form-container">
            <div id="loginPanel">
                <h2 class="form-title">Вход в систему</h2>

                <div id="messageContainer"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required minlength="5" maxlength="254" placeholder="Введите ваш email">
                        <div class="error-text" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password" required maxlength="64" placeholder="Введите ваш пароль">
                        <div class="error-text" id="passwordError"></div>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">Войти</button>
                </form>

                <div class="toggle-auth">
                    <button type="button" class="toggle-btn" id="forgotPasswordBtn">Забыли пароль?</button>
                </div>
                <div class="toggle-auth">
                    <button class="toggle-btn" id="toggleAuthBtn">Нет аккаунта? Зарегистрироваться</button>
                </div>
            </div>

            <div id="resetPanel" class="auth-panel-hidden">
                <h2 class="form-title">Сброс пароля</h2>
                <p class="reset-intro">Укажите email аккаунта — отправим ссылку для установки нового пароля.</p>

                <div id="resetMessageContainer"></div>

                <form id="resetRequestForm">
                    <div class="form-group">
                        <label for="resetEmail">Email:</label>
                        <input type="email" id="resetEmail" name="resetEmail" required minlength="5" maxlength="254" placeholder="Введите ваш email">
                        <div class="error-text" id="resetEmailError"></div>
                    </div>
                    <button type="submit" class="submit-btn" id="resetSubmitBtn">Отправить ссылку</button>
                </form>
                <div class="toggle-auth">
                    <button type="button" class="toggle-btn" id="backToLoginBtn">← Вернуться ко входу</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/login.js"></script>
</body>
</html>
